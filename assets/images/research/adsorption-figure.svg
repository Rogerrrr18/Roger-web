<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d"><title id="t">Phosphorus and fluoride removal</title><desc id="d">Editorial visualization of reported removal rates, 99.6 percent phosphorus and 73.5 percent fluoride, at pH approximately 4 and 20 grams per liter.</desc><rect width="900" height="580" fill="#e8f0ea"/><g fill="none" stroke="#193d35" stroke-width="2"><circle cx="170" cy="270" r="105"/><circle cx="170" cy="270" r="76"/><circle cx="170" cy="270" r="44"/></g><g fill="#d1e0d6"><circle cx="112" cy="190" r="15"/><circle cx="255" cy="258" r="12"/><circle cx="125" cy="338" r="10"/><circle cx="210" cy="347" r="13"/><circle cx="217" cy="179" r="9"/></g><g font-family="Arial, sans-serif" fill="#193d35"><text x="54" y="56" font-size="20" letter-spacing="4">01 / MATERIALS → EVIDENCE</text><text x="54" y="470" font-size="33" font-weight="700">Fe₃O₄@CSH-AAO</text><text x="54" y="505" font-size="19">magnetic mesoporous adsorbent</text><text x="357" y="172" font-size="21">PHOSPHORUS</text><text x="357" y="223" font-size="74" font-weight="700">99.6%</text><text x="357" y="321" font-size="21">FLUORIDE</text><text x="357" y="372" font-size="74" font-weight="700">73.5%</text><text x="357" y="448" font-size="18">pH ≈ 4 · 20 g/L adsorbent</text><text x="357" y="481" font-size="17">Reported conditions in Yang et al., SPT (2025)</text></g><path d="M340 260H829M340 409H829" stroke="#a2bdb0" stroke-width="2"/></svg>
